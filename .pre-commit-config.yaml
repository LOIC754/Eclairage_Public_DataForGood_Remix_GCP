repos:
  # Hooks génériques : espaces en fin de ligne, fin de fichier, YAML valide, gros fichiers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]   # bloque tout fichier > 1 Mo (données brutes)

  # Ruff : linter + formateur Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: ["--fix"]          # corrige automatiquement ce qui peut l'être
      - id: ruff-format

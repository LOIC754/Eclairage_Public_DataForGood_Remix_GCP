[project]
name = "eclaireur"
version = "0.1.0"
description = "pipeline data eclaireur publique version google cloud plateform (GCP)"
authors = [
    {name = "Loic Akamga",email = "loicakamga@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "google-cloud-storage (>=3.15.0,<4.0.0)",
    "google-cloud-bigquery (>=3.45.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]
